version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: oil-commerce-db
    environment:
      POSTGRES_DB: oil_commerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oil_commerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oil-commerce-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oil-commerce-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oil_commerce_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oil-commerce-net

volumes:
  postgres_data:
    driver: local

networks:
  oil-commerce-net:
    driver: bridge
