server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: oil-commerce-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oil_commerce_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:vivin$12}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:vivinmani20@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:efjlzzobtouaavke}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${SPRING_MAIL_HOST:smtp.gmail.com}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  cache:
    type: simple

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET:oil-commerce-super-secret-key-2025-change-in-production-minimum-256-bits}
  access-token-expiry: 900000       # 15 minutes
  refresh-token-expiry: 604800000   # 7 days
  issuer: oil-commerce-backend

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300,http://localhost:4201,http://localhost:3000}

resend:
  api:
    key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:onboarding@resend.dev}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300,http://localhost:4201,http://localhost:3000}
  file:
    upload-dir: ./uploads
    max-size: 5242880
    allowed-types: image/jpeg,image/png,image/webp
  frontend-url: ${APP_FRONTEND_URL:${FRONTEND_URL:https://oil-commerce-frontend.onrender.com}}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    resend-from: ${RESEND_FROM:onboarding@resend.dev}
    brevo-api-key: ${BREVO_API_KEY:}
    brevo-from-email: ${BREVO_FROM_EMAIL:${SPRING_MAIL_USERNAME:vivinmani20@gmail.com}}
    brevo-from-name: ${BREVO_FROM_NAME:Nisha Pure Oils}
  google-sheet:
    pricing-url: https://docs.google.com/spreadsheets/d/1h2O9GLqQaTVUvU2w0pwBMEu9T8FzJSaqu-pn-KGRce4/edit?usp=sharing

razorpay:
  key-id: YOUR_RAZORPAY_KEY_ID
  key-secret: YOUR_RAZORPAY_KEY_SECRET
  currency: INR

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false

logging:
  level:
    com.oilcommerce: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
